<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarea 4 - Planes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1 class="text-center mb-5">Planes de Suscripción</h1>
  <div class="row g-4 text-center">

    <div class="col-12 col-md-4">
      <div class="card h-100 bg-light border-0 shadow-sm">
        <div class="card-body d-flex flex-column p-4">
          <h2 class="h4">Plan Estudiante</h2>
          <p class="display-4 fw-bold my-4">$9.99<small class="fs-6 fw-normal">/mes</small></p>
          <a href="#" class="btn btn-outline-primary mt-auto">Elegir Plan</a>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="card h-100 bg-primary text-white border-0 shadow">
        <div class="card-body d-flex flex-column p-4">
          <div><span class="badge bg-warning text-dark mb-2">Más Popular</span></div>
          <h2 class="h4">Plan Pro VIP</h2>
          <p class="display-4 fw-bold my-4">$24.99<small class="fs-6 fw-normal">/mes</small></p>
          <a href="#" class="btn btn-warning mt-auto">Elegir Plan</a>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="card h-100 bg-dark text-white border-0 shadow-sm">
        <div class="card-body d-flex flex-column p-4">
          <h2 class="h4">Plan Institucional</h2>
          <p class="display-4 fw-bold my-4">$79.99<small class="fs-6 fw-normal">/mes</small></p>
          <a href="#" class="btn btn-warning mt-auto">Elegir Plan</a>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
